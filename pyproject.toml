[project]
name = "ai-agent"
version = "0.1.0"
description = "Воспроизводимые эксперименты и агентные системы на LLM"
readme = "README.md"
authors = [
    { name = "Dmitriy Latkin", email = "lda020504@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "optuna>=5.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "scripts", "tests"]

exclude = [
    ".venv",
    "runs",
    "mlartifacts",
    "notebooks",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # длина строки — пусть ей занимается formatter
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False — допустимо в тестах
"notebooks/**" = ["E402", "F401"]  # в ноутбуках импорты и мусор — норма

[tool.ruff.lint.isort]
known-first-party = ["ai_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
