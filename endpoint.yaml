# Сервер модели для ЛР1 и следующих работ (Правила, п. 3).
# Все параметры генерации передаются в каждом запросе явно: умолчания
# сервера (у vLLM — generation_config.json модели, температура 0,7)
# на результат влиять не должны.
base_url: http://localhost:8000/v1
model: Qwen/Qwen3-4B-Instruct-2507
timeout_s: 600
# ключ доступа внешнего сервиса — только через переменную окружения:
# api_key_env: OPENAI_API_KEY
generation:
  temperature: 0.0
  top_p: 1.0
extra_body:
  top_k: -1                      # vLLM: -1 отключает отсечение по top-k
