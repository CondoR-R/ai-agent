# Сервер модели для ЛР1 и следующих работ (Правила, п. 3).
# Профиль CPU: llama.cpp + Qwen2.5-1.5B-Instruct (GGUF Q4_K_M).
# Все параметры генерации передаются в каждом запросе явно: умолчания
# сервера (temperature 0.8, top_p 0.95) на результат влиять не должны.
base_url: http://localhost:8000/v1
model: Qwen/Qwen2.5-1.5B-Instruct
timeout_s: 600
# ключ доступа внешнего сервиса — только через переменную окружения:
# api_key_env: OPENAI_API_KEY
generation:
  temperature: 0.0
  top_p: 1.0
