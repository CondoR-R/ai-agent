# Опыт 3 ЛР3: Dense и выбранный на dev вариант на 210 утверждениях holdout.
# Запускать только после коммита reports/lr3/selection.json.
experiment: lr3
seed: 0
runtime: {num_threads: 6}
tracked_libs: [sentence-transformers, transformers, openai, numpy, torch]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

encoder:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  device: cpu
  max_seq_length: 512
  batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""

budget_tokens: 2048
generation:
  max_tokens: 128

retrieval:
  top_k: 20
  answer_k: 3
  rrf_depth: 20
  rrf_c: 60.0
  bm25:
    k1: 1.2
    b: 0.75

selection_path: reports/lr3/selection.json

reranker:
  model: cross-encoder/ms-marco-MiniLM-L6-v2
  max_length: 512
  batch_size: 20
  device: cpu

exp3:
  name: holdout
