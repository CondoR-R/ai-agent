# Опыт 1 ЛР3: Dense, BM25 и RRF на 60 утверждениях Q+ из dev.
# Сервер: bash scripts/lr1/start_llama.sh
experiment: lr3
seed: 0
runtime: {num_threads: 6}
tracked_libs: [sentence-transformers, transformers, openai, numpy, torch]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

encoder:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  device: cpu
  max_seq_length: 512
  batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""

budget_tokens: 2048
generation:
  max_tokens: 128

retrieval:
  top_k: 20
  answer_k: 3
  rrf_depth: 20
  rrf_c: 60.0
  bm25:
    k1: 1.2
    b: 0.75

dense_reference_run: runs/lr2-experiment1-2026-11-13_16-09-04-c38c6d

reranker:
  model: cross-encoder/ms-marco-MiniLM-L6-v2
  max_length: 512
  batch_size: 20
  device: cpu

exp1:
  name: complementarity
