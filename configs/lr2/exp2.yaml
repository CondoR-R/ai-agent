# Опыт 2 ЛР2: RAG при k=1 и k=5 на тех же 90 утверждениях dev.
# Сервер: bash scripts/lr1/start_llama.sh
experiment: lr2
seed: 0
runtime: {num_threads: 6}
tracked_libs: [sentence-transformers, transformers, openai, numpy]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

encoder:
  model: BAAI/bge-small-en-v1.5
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  device: cpu
  max_seq_length: 512
  batch_size: 32
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""

budget_tokens: 2048
generation:
  max_tokens: 128

exp2:
  k_values: [1, 5]
