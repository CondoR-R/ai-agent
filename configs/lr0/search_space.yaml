study_name: lr0_search
n_trials: 40
sampler_seed: 42
pruner:
  n_startup_trials: 5
  n_warmup_steps: 5

space:
  lr:
    type: float
    low: 1.0e-4
    high: 1.0e-1
    log: true
    target: train.lr
  n_layers:
    type: int
    low: 1
    high: 3
    target: model.n_layers
  hidden:
    type: int
    low: 32
    high: 512
    log: true
    target: model.hidden
  dropout:
    type: float
    low: 0.0
    high: 0.5
    target: model.dropout
  weight_decay:
    type: float
    low: 1.0e-6
    high: 1.0e-2
    log: true
    target: train.weight_decay
  batch_size:
    type: categorical
    choices: [32, 64, 128]
    target: train.batch_size
