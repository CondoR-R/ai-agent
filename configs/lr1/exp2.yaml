# Опыт 2: длина ответа и скорость генерации (п. 4.2).
# Сервер: bash scripts/lr1/start_llama.sh
experiment: lr1
seed: 0
runtime: {num_threads: 6}
tracked_libs: [openai, transformers, huggingface-hub]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

exp2:
  prompt_tokens: 1024
  output_lengths: [16, 64, 256, 1024]
  repeats: 5                       # запросов на длину ответа
  warmup_tokens: 1024
  warmup_output_tokens: 64

# нижняя граница TPOT из п. 2.1: веса модели / пропускная способность
# памяти. Qwen2.5-1.5B-Instruct в Q4_K_M занимает ≈1.11 ГБ (≈1.04 ГиБ),
# память Apple M1 передаёт до 68.25 ГБ/с. На другом оборудовании
# переопределите:
#   --set decode_memory.weights_gib=... --set decode_memory.memory_bandwidth_gb_s=...
decode_memory:
  weights_gib: 1.04
  memory_bandwidth_gb_s: 68.25
  description: "Qwen2.5-1.5B-Instruct, Q4_K_M, ≈1.11 ГБ"
