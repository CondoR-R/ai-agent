# Опыт 1, серия prefix_cache: один и тот же запрос трижды (кеш префикса ВКЛЮЧЁН).
# Сервер: bash scripts/lr1/start_llama.sh   (кеш промпта по умолчанию включён)
experiment: lr1
seed: 0
runtime: {num_threads: 6}
tracked_libs: [openai, transformers, huggingface-hub]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

exp1:
  mode: prefix_cache
  prefix_caching: true
  prompt_tokens: 8192
  repeats: 3                       # одинаковых запросов подряд
  n_prompts: 1                     # сколько разных запросов проверить
  output_tokens: 16
  warmup_tokens: [1024, 8192]      # прогрев на обеих используемых длинах
