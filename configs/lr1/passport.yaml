experiment: lr1
seed: 0
runtime: {num_threads: 6}
# версии этих пакетов пишутся в metadata.json
tracked_libs: [openai, transformers, huggingface-hub]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768           # сервер обязан отдавать именно этот предел
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

checks:
  prompt_tokens: 1024            # длина запроса для проверки токенизации
  fixed_output_tokens: 64        # ответ ровно такой длины с ignore_eos
  kv_rel_tol: 0.05               # допустимое расхождение ёмкости KV-кеша
