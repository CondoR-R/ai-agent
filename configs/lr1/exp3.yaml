# Опыт 3: нагрузка, пропускная способность и goodput (п. 4.3).
# Сервер: CTX=65536 PARALLEL=32 bash scripts/lr1/start_llama.sh
experiment: lr1
seed: 0
runtime: {num_threads: 6}
tracked_libs: [openai, transformers, huggingface-hub]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 65536             # общий контекст, по 2048 на 32 слота
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

exp3:
  prompt_tokens: 1024
  output_tokens: 128
  clients: [1, 2, 4, 8, 16, 32]
  min_requests: 8                  # запросов на уровень не меньше
  requests_per_client: 2           # max(8, 2c) запросов на уровень
  warmup_tokens: 1024
  warmup_output_tokens: 128
  # пределы интерактивного ассистента на CPU (на GPU в методичке
  # 2 с и 100 мс). Для другого оборудования переопределите через
  # --set exp3.limits.ttft_p90_s=... --set exp3.limits.tpot_median_s=...
  limits:
    ttft_p90_s: 10.0
    tpot_median_s: 0.15
