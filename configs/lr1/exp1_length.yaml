# Опыт 1, серия ttft_vs_length: длина запроса и TTFT (кеш префикса ВЫКЛЮЧЕН).
# Сервер: bash scripts/lr1/start_llama.sh --no-cache-prompt
experiment: lr1
seed: 0
runtime: {num_threads: 6}
tracked_libs: [openai, transformers, huggingface-hub]

endpoint_path: endpoint.yaml

server:
  name: llama.cpp
  max_model_len: 32768
  log_path: /tmp/lr1-llama/llama.log
  cmd_path: /tmp/lr1-llama/llama.cmd

exp1:
  mode: ttft_vs_length
  prefix_caching: false            # состояние сервера; несовпадение — ошибка
  prompt_lengths: [256, 1024, 4096, 8192, 16384]
  repeats: 5                       # запросов на длину
  output_tokens: 16
  warmup_tokens: [256, 1024, 4096, 8192, 16384]   # по одному запросу на длину
